<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 7 Challenge Starter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>

    <main>
      <section class="content">
        <h1>Output</h1>
        <h2 id="memes">Programmer memes</h2>
        <div class="divMemes"></div>
        <h2 id="jokes">Tell me someting funny!</h2>
        <div class="divJokes"></div>
        <h2 id="wisdom">Give me some wisdom...</h2>
        <div class="divWisdom"></div>
        <h2 id="riddle">I want a riddle!</h2>
        <div class="divRiddle"></div>
      </section>

     
      <section class="sidebar">
        <h2>Actions</h2>
        <button onclick="showMeme()">Show a Meme</button>
        <button onclick="showJoke()">Tell Me a Joke</button>
        <button onclick="showQuote()">Random Quote</button>
        <button onclick="showRiddle()">Riddle me</button>
        <button class="reveal-btn" onclick="revealAnswers()">
          Reveal Riddle Answer
        </button>
        <p class="attribution">
          Code challenge by
          <a href="https://www.twitter.com/zg_dev" target="_top">@zg_dev</a>
        </p>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
